# Dependabot configuration.
#
# Two ecosystems are watched: the npm workspace and the GitHub Actions used by
# the workflows. Updates are grouped so a routine bump arrives as one pull
# request instead of a dozen.
version: 2

updates:
  # --- npm ----------------------------------------------------------------
  # The workspace has a single lockfile at the root, shared by the library and
  # the two applications.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Prefer moving the lockfile only. The declared ranges already allow patch
    # and minor updates, so package.json changes only when a range must move.
    versioning-strategy: 'increase-if-necessary'
    # The changelog and the version bump are generated from the commit history
    # (Conventional Commits). `chore` is excluded from the changelog, which is
    # the right bucket for a dependency bump.
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      # Angular packages are released in lockstep and must be updated together.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
          - 'angular-eslint'
      # Everything else, split by dependency type so the diffs stay readable.
      production:
        dependency-type: 'production'
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
          - 'angular-eslint'
      development:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
          - 'angular-eslint'
    ignore:
      # No major is ever an automatic pull request.
      #
      # The toolchain moves as one unit: ng-packagr 22 requires
      # @angular/compiler-cli ^22 and TypeScript >=6, angular-eslint tracks the
      # Angular major, and a vitest or jsdom major changes how the whole suite
      # runs. A major is a deliberate, coordinated migration — the peer range
      # published to consumers moves with it — so majors are raised by hand.
      #
      # Patch and minor updates still arrive automatically, and so do the
      # security updates that matter day to day.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
