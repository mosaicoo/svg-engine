name: Release

# ─────────────────────────────────────────────────────────────────────
# Publish-on-tag via npm Trusted Publishing (OIDC) — sem NPM_TOKEN.
#
# Trigger: push de uma tag Git `v*` (criada por `npm run release` via
# standard-version).
#
# Autenticação: OIDC (Trusted Publisher). NÃO usa secret NPM_TOKEN nem
# "bypass 2FA". Requisitos:
#   - `permissions: id-token: write` (gera o token OIDC efêmero).
#   - npm CLI >= 11.5.1 (instalado abaixo; o Node 22 traz o npm 10).
#   - O pacote `@mosaicoo/svg-engine` PRECISA já existir no npm E um
#     Trusted Publisher precisa estar configurado em npmjs.com apontando
#     para: org/usuário = mosaicoo, repositório = svg-engine, workflow =
#     release.yml. Bootstrap: publique a 1ª versão localmente
#     (`npm run publish:lib`), configure o Trusted Publisher, e a partir
#     daí as tags publicam por aqui.
#
# Proveniência (provenance) é gerada AUTOMATICAMENTE em publicações OIDC
# (repo público + pacote público) — sem precisar do flag `--provenance`.
#
# Só a LIB é publicada (`dist/svg-engine`). Os apps (playground,
# svg-studio) nunca são publicados. O pacote leva apenas o código
# compilado (`.mjs` + `.d.ts`): os sourcemaps são removidos pelo
# `strip:maps` antes do publish.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build + Publish (OIDC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) exige npm >= 11.5.1; o Node 22 traz o npm 10.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Test library
        run: npx ng test svg-engine --watch=false

      - name: Build library
        run: npx ng build svg-engine

      - name: Strip sourcemaps
        run: npm run strip:maps

      - name: Pack tarball (dry-run)
        working-directory: dist/svg-engine
        run: npm pack --dry-run

      - name: Pack tarball (artifact)
        working-directory: dist/svg-engine
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg-engine-${{ github.ref_name }}
          path: dist/svg-engine/*.tgz
          if-no-files-found: error
          retention-days: 90

      # OIDC: sem token. `access`/provenance vêm do publishConfig + ambiente.
      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: dist/svg-engine
        run: npm publish
