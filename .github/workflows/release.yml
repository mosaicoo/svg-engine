name: Release

# ─────────────────────────────────────────────────────────────────────
# Publish-on-tag through npm Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# Trigger: pushing a Git tag `v*`, created by `npm run release`
# (standard-version).
#
# Authentication: OIDC (Trusted Publisher). No NPM_TOKEN secret, no 2FA
# bypass. Requirements:
#   - `permissions: id-token: write`, which mints the short-lived OIDC token.
#   - npm CLI >= 11.5.1 (installed below; Node 22 ships npm 10).
#   - The package `@mosaicoo/svg-engine` must already exist on npm, and a
#     Trusted Publisher must be configured at npmjs.com pointing to
#     organization `mosaicoo`, repository `svg-engine`, workflow
#     `release.yml`. Bootstrap: publish the first version locally with
#     `npm run publish:lib`, configure the Trusted Publisher, and every tag
#     from then on publishes from here.
#
# Provenance is generated automatically for an OIDC publish of a public
# package from a public repository — the `--provenance` flag is not needed.
#
# Only the library is published (`dist/svg-engine`). The applications
# (playground, svg-studio) are never published. The package carries compiled
# output only (`.mjs` + `.d.ts`); `strip:maps` removes the sourcemaps
# before the publish step.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build + Publish (OIDC)
    runs-on: ubuntu-latest
    # Publication gate: the `npm-release` environment requires a reviewer's
    # approval before this job runs, and only accepts being reached from a
    # `v*` tag. Publishing to npm is irreversible — a version cannot be
    # unpublished and republishing the same one returns 403 — so the
    # confirmation is explicit: creating a tag alone publishes nothing.
    environment: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Fail early when package.json .version and SVG_ENGINE_VERSION disagree.
      - name: Check version lockstep
        run: npm run check:version

      - name: Lint
        run: npx ng lint

      # Build BEFORE test: the specs import `@mosaicoo/svg-engine/*`, which the
      # root tsconfig maps to `dist/svg-engine/*` — the built package, not the
      # sources. Without it, `ng test` fails with TS2307 "Cannot find module".
      - name: Build library
        run: npx ng build svg-engine

      - name: Test library
        run: npx ng test svg-engine --watch=false

      - name: Strip sourcemaps
        run: npm run strip:maps

      - name: Pack tarball (dry-run)
        working-directory: dist/svg-engine
        run: npm pack --dry-run

      - name: Pack tarball (artifact)
        working-directory: dist/svg-engine
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: svg-engine-${{ github.ref_name }}
          path: dist/svg-engine/*.tgz
          if-no-files-found: error
          retention-days: 90

      # OIDC: no token. `access` and provenance come from publishConfig and
      # the workflow environment.
      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: dist/svg-engine
        run: npm publish

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish

    # This is the only job that writes to the repository, and only to create
    # the release entry. The publishing job stays read-only plus its OIDC
    # token. Running after the publish means a failure here cannot affect a
    # version that already reached npm.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The notes are taken from the changelog that standard-version already
      # generated for this version, so the release page and CHANGELOG.md never
      # disagree. If the section is missing, fall back to generated notes
      # rather than failing the release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME"               --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            echo "No changelog section for $version; using generated notes."
            gh release create "$GITHUB_REF_NAME"               --title "$GITHUB_REF_NAME" --generate-notes
          fi
