name: Release

# ─────────────────────────────────────────────────────────────────────
# D-031 — Publish on tag.
#
# Trigger: pushing a Git tag matching `v*` (created by
# `npm run release` via standard-version).
#
# Flow:
#   1. Build the library (`npx ng build svg-engine` → `dist/svg-engine`).
#   2. Run the full test suite as a gate.
#   3. `npm pack` (dry-run) to verify the tarball contents.
#   4. `npm publish` IF an `NPM_TOKEN` secret is configured.
#      Without the secret, the workflow stops at the pack step —
#      the artifact is uploaded as a workflow artifact for manual
#      inspection. This makes the workflow "ready when you add token"
#      without forcing premature publish decisions.
#
# Registry choice is pending decision D-025?
# (npm public / GitHub Packages / Mosaicoo private registry).
# When that decision lands, point `registry-url` accordingly.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build + Publish (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['22']
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Test library
        run: npx ng test svg-engine --watch=false

      - name: Build library
        run: npx ng build svg-engine

      - name: Pack tarball (dry-run)
        working-directory: dist/svg-engine
        run: npm pack --dry-run

      - name: Pack tarball (artifact)
        working-directory: dist/svg-engine
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg-engine-${{ github.ref_name }}
          path: dist/svg-engine/*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: dist/svg-engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Skip publish (no NPM_TOKEN secret)
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::notice::NPM_TOKEN secret not set — skipping npm publish."
          echo "The tarball is uploaded as a workflow artifact for manual review."
          echo "To enable automatic publish, add NPM_TOKEN as a repository secret."
