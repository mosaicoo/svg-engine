name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (svg-engine + playground)
        run: npx ng lint

      - name: Build library svg-engine
        run: npx ng build svg-engine

      - name: Build app playground (development)
        run: npx ng build playground --configuration=development

      - name: Build app playground (production)
        run: npx ng build playground --configuration=production

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only Chromium for now (E2E-F4). `--with-deps` pulls the OS libraries
      # the browser needs on the Ubuntu runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The playground imports the library through its BUILT output: tsconfig
      # `paths` map `svg-engine/*` -> `./dist/svg-engine/*`. So the lib must be
      # built before `ng serve playground` can resolve those entry points —
      # otherwise esbuild fails with `Could not resolve "svg-engine/edit"` (etc.)
      # on the clean runner. The lint-and-build job builds it too; this job
      # needs its own copy because GitHub jobs don't share a workspace.
      - name: Build library svg-engine
        run: npx ng build svg-engine

      # Playwright's webServer boots `ng serve playground` (npm run e2e:serve),
      # which skips the prestart Whisper-model assembly the E2E never needs.
      # `process.env.CI` flips the config to retries/2 + workers/2 + html report.
      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
