name: Feature request
description: Suggest new functionality
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the library do? Include the API you would expect, if you have one in mind.
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point most likely affected
      options:
        - core
        - render
        - io
        - optimize
        - edit
        - ui
        - ai/nlu
        - ai/nlu-ui
        - ai/nlu-voice-wasm
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they are not enough.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
