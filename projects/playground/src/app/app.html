<main class="playground">
  <header>
    <h1>{{ title() }}</h1>
    <p class="subtitle">
      Dogfooding harness for <code>svg-engine/core</code>. Renderer arrives in Bloco 2.
    </p>
  </header>

  <section class="actions" aria-label="Editor commands">
    <button type="button" (click)="addRect()">Add random rect</button>
    <button type="button" (click)="nudgeFirst()">Nudge first (+10, +10)</button>
    <button type="button" (click)="removeFirst()">Remove first</button>
    <button type="button" (click)="undo()" [disabled]="!canUndo()">Undo</button>
    <button type="button" (click)="redo()" [disabled]="!canRedo()">Redo</button>
  </section>

  <section class="state" aria-label="Document state">
    <p><strong>Node count:</strong> {{ nodeCount() }}</p>
    <p><strong>Children (id prefix):</strong></p>
    <ul>
      @for (id of nodeIds(); track id) {
        <li>{{ id }}</li>
      } @empty {
        <li class="empty">(no children yet)</li>
      }
    </ul>
  </section>

  <router-outlet />
</main>
